# ─────────────────────────────────────────────────────────────────────────────
# 1) Plugins + TPM bootstrap
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'rose-pine/tmux'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'laktak/extrakto'                 # extract text/URLs from pane

# prefix + Tab opens extrakto; enter copies, tab pastes, ctrl-o opens
set -g @extrakto_key "tab"
set -g @extrakto_copy_key "enter"
set -g @extrakto_insert_key "tab"
set -g @extrakto_clip_tool "pbcopy"
set -g @extrakto_open_key "ctrl-o"
set -g @extrakto_editor 'nvim'

# ──────────────────────────────────────────────────────────────────────────────
# 2) Continuum auto-boot & restore
# boot off: .zshrc already execs `tmux new-session -A -s main`, and the plugin's
# LaunchAgent races it with cwd `/`, which is why sessions used to open in /.
set -g @continuum-boot    'off'
set -g @continuum-restore 'off'  # manual restore: prefix + Ctrl-r

# without this a restore gives you empty panes, which is barely a restore
set -g @resurrect-capture-pane-contents 'on'

# ──────────────────────────────────────────────────────────────────────────────
# 3) Rose-Pine theme settings
set -g @rose_pine_variant                  'main'
set -g @rose_pine_host                     'off'
set -g @rose_pine_date_time                ""
set -g @rose_pine_user                     'on'
set -g @rose_pine_directory                'off'
set -g @rose_pine_bar_bg_disable           'on'
set -g @rose_pine_bar_bg_disabled_color_option 'default'
set -g @rose_pine_only_windows             'off'
set -g @rose_pine_disable_active_window_menu 'on'
set -g @rose_pine_default_window_behavior  'on'
set -g @rose_pine_show_current_program     'on'
set -g @rose_pine_show_pane_directory      'on'
set -g @rose_pine_left_separator           ' > '
set -g @rose_pine_right_separator          ' '
set -g @rose_pine_field_separator          ' | '
set -g @rose_pine_window_separator         ' - '
set -g @rose_pine_session_icon             ''
set -g @rose_pine_current_window_icon      ''
set -g @rose_pine_folder_icon              ''
set -g @rose_pine_username_icon            ''
set -g @rose_pine_hostname_icon            ''
set -g @rose_pine_date_time_icon           '󰃰'
set -g @rose_pine_window_status_separator  '  '

run '~/.tmux/plugins/tpm/tpm'

# ──────────────────────────────────────────────────────────────────────────────
# 4) Core options
set -g mouse on
set-option -g history-limit 50000  # per pane, so this is RAM. raise if you scroll past it
set -g display-time 2000
set -g status-interval 5   # default 15 lags the @claude_bar row

set -s escape-time 10      # faster prefix sequences
set -g repeat-time 500     # double-tap prefix window for repeat
set -g focus-events on     # send focus events to applications
set -g detach-on-destroy off # hop to MRU session instead of detaching (Ghostty would exit)
set -g set-clipboard on    # OSC 52 clipboard, works over SSH
set -g allow-passthrough on # OSC 9;4 progress through to Ghostty
set -s extended-keys on    # distinguish Shift+Enter from Enter (Claude Code newline)
set -as terminal-features 'xterm*:extkeys'

# pane/window numbering
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

# Stop the shell from renaming tmux windows
set-option -g allow-rename off

# automatic renaming
set -g automatic-rename on
set -g automatic-rename-format '#{pane_current_command}'

# ──────────────────────────────────────────────────────────────────────────────
# 5) Copy Mode (vi + system clipboard)
setw -g mode-keys vi
bind -T copy-mode-vi v     send -X begin-selection
bind -T copy-mode-vi C-v   send -X rectangle-toggle
bind -T copy-mode-vi H     send -X start-of-line
bind -T copy-mode-vi L     send -X end-of-line
bind -T copy-mode-vi y     send -X copy-selection-and-cancel
bind -T copy-mode-vi Enter send -X copy-selection-and-cancel
bind -T copy-mode-vi C-y   send -X copy-pipe-and-cancel "pbcopy"

# grab whole paths and URLs on double-click / w, not fragments
set -g word-separators ' @"=()[]{}<>|;:'

# ──────────────────────────────────────────────────────────────────────────────
# 6) Prefix & key-bindings
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# splits in current path
bind | split-window -h -c "#{pane_current_path}"
bind \\ split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# resize panes (Alt + Shift + arrows, no prefix needed)
bind -n M-S-Left  resize-pane -L 5
bind -n M-S-Right resize-pane -R 5
bind -n M-S-Up    resize-pane -U 5
bind -n M-S-Down  resize-pane -D 5

# new window in current path
bind c new-window -c "#{pane_current_path}"

# window navigation
bind -n C-S-Left  previous-window
bind -n C-S-Right next-window

# window management
bind W new-window \; command-prompt "rename-window %%"
bind X confirm-before kill-session
bind m command-prompt "move-window -t %%"
bind M command-prompt "swap-window -t %%"

# pane breakout & window joining
bind-key ! break-pane -d
bind-key j choose-window 'join-pane -s "%%"'
bind-key J join-pane -s +1
bind BTab last-pane

# sessions
bind S choose-session

# fuzzy session switcher: enter switches, ctrl-x kills the highlighted session
bind -n M-j display-popup -E -w 60% -h 50% "~/.dotfiles/tmux/session-switch.sh"
bind -n M-n command-prompt -p "new session:" "new-session -c '#{pane_current_path}' -s '%%'"
bind -n M-r command-prompt -I "#S" "rename-session -- '%%'"

# pop the newest Claude alert off the stack and jump to that pane
bind -n M-c run-shell '~/.dotfiles/tmux/claude-notify.sh pop'

# jump back to where M-c came from. Keep the quotes — bare M-' eats the line.
bind -n "M-'" run-shell '~/.dotfiles/tmux/claude-notify.sh back'

# landing on a pane reads its alert, so drop it. Needs focus-events on (§4).
set-hook -g pane-focus-in 'run-shell "~/.dotfiles/tmux/claude-notify.sh clear #{session_name}:#{window_index}.#{pane_index}"'
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

bind f display-popup -E -w 80% -h 40% "tmux-sessionizer"
bind o display-popup -E -w 80% -h 40% "~/.dotfiles/tmux/open-url.sh"
bind g display-popup -E -w 85% -h 75% -d "#{pane_current_path}"
bind G display-popup -E -w 85% -h 75% -d "#{pane_current_path}" lazygit

# zen mode: pad a single pane in from both edges. `z` zooms, `Z` is its opposite.
set -g @zen_width 120
set -g @zen_border '#191724'   # rose-pine base — hides the pad borders
bind Z run-shell '~/.dotfiles/tmux/zen.sh'
set-hook -g pane-exited 'run-shell "~/.dotfiles/tmux/zen.sh reap"'

# ──────────────────────────────────────────────────────────────────────────────
# 7) Terminal & cursor overrides
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ',*:Tc'                          # truecolor
set -ag terminal-overrides ',*:sitm=\E[3m:ritm=\E[23m'     # italics
set -ag terminal-overrides ',*:smso=\E[7m:rmso=\E[27m'     # standout
set -ag terminal-overrides ',*:Ss=\E[%p1%d q:Se=\E[2 q'    # cursor shape
set -ag terminal-overrides ',*:Smulx=\E[4::%p1%dm'         # undercurl
set -ag terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'  # undercurl colors

# ──────────────────────────────────────────────────────────────────────────────
# 8) Status bar - handled by rose-pine plugin after TPM loads
set -g status-justify centre

# Second status row above the bar holding the Claude alert; rose-pine's bar moves
# to [1]. Format lives in a user option because run-shell expands its argument.
# `set -gu` first keeps re-sourcing idempotent (else [0] gets copied into [1]).
set -g @claude_bar '#[align=centre]#{?@claude_alert,#{@claude_alert}#[default],}'
run-shell 'tmux set -gu status-format; \
    tmux set -g status 2; \
    tmux set -g "status-format[1]" "$(tmux show -gv "status-format[0]")"; \
    tmux set -g "status-format[0]" "$(tmux show -gv @claude_bar)"'

# Per-window Claude state glyph in the tab strip. Must run after TPM — it wraps
# whatever window format rose-pine wrote. No-ops if already wrapped.
run-shell '~/.dotfiles/tmux/claude-notify.sh install'
