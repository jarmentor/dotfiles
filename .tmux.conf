# ─────────────────────────────────────────────────────────────────────────────
# 1) Plugins + TPM bootstrap
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'rose-pine/tmux'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'laktak/extrakto'                 # extract text/URLs from pane

# Extrakto configuration
set -g @extrakto_key "tab"            # prefix + Tab opens extrakto
set -g @extrakto_copy_key "enter"     # copy to clipboard
set -g @extrakto_insert_key "tab"     # paste into pane
set -g @extrakto_clip_tool "pbcopy"   # clipboard tool for macOS
set -g @extrakto_open_key "ctrl-o"    # open URLs/files
set -g @extrakto_editor 'nvim'        # in nvim pls

# ──────────────────────────────────────────────────────────────────────────────
# 2) Continuum auto-boot & restore
set -g @continuum-boot    'on'   # start tmux server at login
set -g @continuum-restore 'off'  # manual restore only (use prefix + Ctrl-r)

# ──────────────────────────────────────────────────────────────────────────────
# 3) Rose-Pine theme settings
set -g @rose_pine_variant                  'main'
set -g @rose_pine_host                     'off'
set -g @rose_pine_date_time                ""
set -g @rose_pine_user                     'on'
set -g @rose_pine_directory                'off'
set -g @rose_pine_bar_bg_disable           'on'
set -g @rose_pine_bar_bg_disabled_color_option 'default'
set -g @rose_pine_only_windows             'off'
set -g @rose_pine_disable_active_window_menu 'on'
set -g @rose_pine_default_window_behavior  'on'
set -g @rose_pine_show_current_program     'on'
set -g @rose_pine_show_pane_directory      'on'
set -g @rose_pine_left_separator           ' > '
set -g @rose_pine_right_separator          ' '
set -g @rose_pine_field_separator          ' | '
set -g @rose_pine_window_separator         ' - '
set -g @rose_pine_session_icon             ''
set -g @rose_pine_current_window_icon      ''
set -g @rose_pine_folder_icon              ''
set -g @rose_pine_username_icon            ''
set -g @rose_pine_hostname_icon            ''
set -g @rose_pine_date_time_icon           '󰃰'
set -g @rose_pine_window_status_separator  '  '

# Initialize TMUX plugin manager (TPM will load all plugins including rose-pine)
run '~/.tmux/plugins/tpm/tpm'

# ──────────────────────────────────────────────────────────────────────────────
# 4) Core options
set -g mouse on
set-option -g history-limit 1000000
set -g display-time 2000

set -s escape-time 10      # faster prefix sequences
set -g repeat-time 500     # double-tap prefix window for repeat
set -g focus-events on     # send focus events to applications
# Killing the last window destroys the session; without this the client detaches
# and Ghostty's shell exits with it. `off` hops to the most recently used other
# session instead, matching M-j's MRU order. Truly last session still detaches.
set -g detach-on-destroy off
set -g set-clipboard on    # enable OSC 52 clipboard (works over SSH)
set -g allow-passthrough on # let OSC 9;4 progress through to Ghostty (only fires for visible panes)
set -s extended-keys on             # distinguish Shift+Enter from Enter (Claude Code newline)
set -as terminal-features 'xterm*:extkeys'

# pane/window numbering
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

# Stop the shell from renaming tmux windows
set-option -g allow-rename off

# automatic renaming
set -g automatic-rename on
set -g automatic-rename-format '#{pane_current_command}'

# ──────────────────────────────────────────────────────────────────────────────
# 5) Copy Mode (vi + system clipboard)
setw -g mode-keys vi
bind -T copy-mode-vi v     send -X begin-selection
bind -T copy-mode-vi y     send -X copy-selection-and-cancel
bind -T copy-mode-vi Enter send -X copy-selection-and-cancel
bind -T copy-mode-vi C-y   send -X copy-pipe-and-cancel "pbcopy"

# ──────────────────────────────────────────────────────────────────────────────
# 6) Prefix & key-bindings
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# splits in current path
bind | split-window -h -c "#{pane_current_path}"
bind \\ split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# resize panes (Cmd + Alt + arrows, no prefix needed)
bind -n M-S-Left  resize-pane -L 5
bind -n M-S-Right resize-pane -R 5
bind -n M-S-Up    resize-pane -U 5
bind -n M-S-Down  resize-pane -D 5

# new window in current path
bind c new-window -c "#{pane_current_path}"

# window navigation
bind n next-window
bind p previous-window
bind -n C-S-Left  previous-window
bind -n C-S-Right next-window

# window management
bind w choose-window  # show window list
bind W new-window \; command-prompt "rename-window %%"  # new window with immediate rename
bind x confirm-before kill-window  # kill window with confirmation
bind X confirm-before kill-session  # kill session with confirmation
bind m command-prompt "move-window -t %%"  # move window to position
bind M command-prompt "swap-window -t %%"  # swap window with another

# pane breakout & window joining
bind-key ! break-pane -d  # break pane to new window in background
bind-key j choose-window 'join-pane -s "%%"'  # join selected window as pane
bind-key J join-pane -s +1  # join next window as pane in current window

# pane/window quick toggle
bind BTab last-pane            # prefix + Shift-Tab → jump to last pane

# sessions & windows
bind S choose-session         # pick session with uppercase S

# fast fuzzy session switcher (no prefix): Alt-j — MRU order, current excluded
# enter switches; ctrl-x kills the highlighted session
bind -n M-j display-popup -E -w 60% -h 50% "~/.dotfiles/tmux/session-switch.sh"

# new session (no prefix): Alt-n, prompts for a name, opens in current pane's dir
bind -n M-n command-prompt -p "new session:" "new-session -c '#{pane_current_path}' -s '%%'"

# rename current session (no prefix): Alt-r, prefilled with current name
bind -n M-r command-prompt -I "#S" "rename-session -- '%%'"

# pop the newest Claude alert off the stack and jump to that pane
bind -n M-c run-shell '~/.dotfiles/tmux/claude-notify.sh pop'

# Alt-b returns to wherever the last M-c jumped from, and toggles back. Not
# M-C: extended-keys (§2) changes how Shift+Alt is encoded and tmux never saw it.
bind -n M-b run-shell '~/.dotfiles/tmux/claude-notify.sh back'

# Landing on a pane by any route — select-pane, window switch, alt-tabbing back
# into the terminal — reads its alert, so drop it. Needs focus-events on (§2).
set-hook -g pane-focus-in 'run-shell "~/.dotfiles/tmux/claude-notify.sh clear #{session_name}:#{window_index}.#{pane_index}"'
bind , command-prompt "rename-window %%"
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

# sessionizer & session management
bind f display-popup -E -w 80% -h 40% "tmux-sessionizer"

# open URL picker from current pane
bind o display-popup -E -w 80% -h 40% "~/.dotfiles/tmux/open-url.sh"

# quick floating terminal for one-off commands (opens in current pane's directory)
bind g display-popup -E -w 85% -h 75% -d "#{pane_current_path}"

# ──────────────────────────────────────────────────────────────────────────────
# 7) Terminal & cursor overrides
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ',*:Tc'                          # truecolor
set -ag terminal-overrides ',*:sitm=\E[3m:ritm=\E[23m'     # italics
set -ag terminal-overrides ',*:smso=\E[7m:rmso=\E[27m'     # standout
set -ag terminal-overrides ',*:Ss=\E[%p1%d q:Se=\E[2 q'    # cursor shape
set -ag terminal-overrides ',*:Smulx=\E[4::%p1%dm'         # undercurl
set -ag terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'  # undercurl colors

# ──────────────────────────────────────────────────────────────────────────────
# 8) Status bar - handled by rose-pine plugin after TPM loads
set -g status-justify centre

# Second status row above the bar, holding only the Claude alert, centred. Empty
# when there's no alert, so it doubles as breathing room between pane and bar.
# tmux draws status-format[0] topmost, so [0] is that row and the real rose-pine
# bar moves to [1] — which leaves status-right alone.
#
# Held in a user option because run-shell format-expands its argument, so a
# literal #{?...} written inline would be eaten before it ever reaches the option.
# The leading `set -gu` resets the array to tmux's built-ins, which is what makes
# re-sourcing idempotent (otherwise the second pass copies row [0] into [1]) and
# keeps this working if a tmux upgrade changes the stock format.
set -g @claude_bar '#[align=centre]#{?@claude_alert,#{@claude_alert}#[default],}'
run-shell 'tmux set -gu status-format; \
    tmux set -g status 2; \
    tmux set -g "status-format[1]" "$(tmux show -gv "status-format[0]")"; \
    tmux set -g "status-format[0]" "$(tmux show -gv @claude_bar)"'

# Per-window Claude state glyph in the tab strip. Must run after TPM, since it
# wraps whatever window format rose-pine just wrote; the script no-ops if the
# wrapper is already there, so re-sourcing is safe.
run-shell '~/.dotfiles/tmux/claude-notify.sh install'
